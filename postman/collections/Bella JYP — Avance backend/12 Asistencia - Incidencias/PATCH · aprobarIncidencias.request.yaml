$kind: http-request
description: |-
  PATCH /api/asistencia/incidencias/aprobar
  Origen: src/modules/asistencia/controller/incidencias.controller.ts:69
  Handler: aprobarIncidencias
  Roles: ADMIN, RRHH
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/v1/asistencia/incidencias/aprobar"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "periodo": "{{periodo}}",
      "empleado_id": "{{empleado_id}}"
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test('HTTP esperado: [200]', () =>
      pm.expect([200]).to.include(pm.response.code));

      if (pm.response.code < 300) pm.test('Respuesta JSON', () =>
      pm.response.json());
    language: text/javascript
order: 2000
