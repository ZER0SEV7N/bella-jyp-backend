$kind: http-request
description: |-
  PATCH /api/rrhh/cargo/:id/reactive
  Origen: src/modules/RRHH/organizacion/controllers/cargo.controller.ts:105
  Handler: reactive
  Roles: ADMIN, RRHH
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/v1/rrhh/cargo/{{cargo_id}}/reactivar"
method: PATCH
scripts:
  - type: afterResponse
    code: >-
      pm.test('HTTP esperado: [200]', () =>
      pm.expect([200]).to.include(pm.response.code));

      if (pm.response.code < 300) pm.test('Respuesta JSON', () =>
      pm.response.json());
    language: text/javascript
examples: .resources/PATCH · reactive.resources/examples
order: 4000
