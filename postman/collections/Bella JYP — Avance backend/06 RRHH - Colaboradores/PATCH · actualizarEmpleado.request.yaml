$kind: http-request
description: |-
  PATCH /api/rrhh/empleado/:id/actualizar
  Origen: src/modules/RRHH/organizacion/controllers/empleado.controller.ts:99
  Handler: actualizarEmpleado
  Roles: ADMIN, RRHH
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/v1/rrhh/empleado/{{empleado_id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "telefono": "900000000",
      "direccion": "Dirección de prueba, Lima"
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test('HTTP esperado: [200]', () =>
      pm.expect([200]).to.include(pm.response.code));

      if (pm.response.code < 300) pm.test('Respuesta JSON', () =>
      pm.response.json());
    language: text/javascript
examples: .resources/PATCH · actualizarEmpleado.resources/examples
order: 3000
