$kind: http-request
description: |-
  GET /api/afp/comisiones
  Origen: src/modules/payroll/afp/controller/afp.controller.ts:92
  Handler: listarComision
  Roles: ADMIN, CONTADOR, ASISTENTE, RRHH
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/afp/comisiones?page=1&limit=10"
method: GET
queryParams:
  - key: page
    value: "1"
  - key: limit
    value: "10"
  - key: afp_id
    value: "{{tipo_afp_id}}"
    disabled: true
  - key: solo_vigentes
    value: "true"
    disabled: true
scripts:
  - type: afterResponse
    code: >-
      pm.test('HTTP esperado: [200]', () =>
      pm.expect([200]).to.include(pm.response.code));

      if (pm.response.code < 300) pm.test('Respuesta JSON', () =>
      pm.response.json());
    language: text/javascript
order: 2000
