$kind: http-request
description: >-
  POST /api/rrhh/empleados/bulk/confirmar

  Origen:
  src/modules/RRHH/organizacion/controllers/empleado-bulk.controller.ts:107

  Handler: confirmBulk

  Roles: ADMIN, RRHH

  HTTP esperado con datos y estado válidos: 202.

  Ejecutar validar primero: su script captura filas_validas_json. El processor
  ya existe en src/workers/carga-masiva.
url: "{{base_url}}/api/v1/rrhh/empleados-bulk/confirmar"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"filas_validas_data": {{filas_validas_json}}}'
scripts:
  - type: afterResponse
    code: >-
      pm.test('HTTP esperado: [202]', () =>
      pm.expect([202]).to.include(pm.response.code));

      if (pm.response.code < 300) pm.test('Respuesta JSON', () =>
      pm.response.json());

      if (pm.response.code === 202) { const r=pm.response.json(); const d=r.data
      || r; if (d.jobId) pm.environment.set('job_id', d.jobId); }
    language: text/javascript
order: 3000
