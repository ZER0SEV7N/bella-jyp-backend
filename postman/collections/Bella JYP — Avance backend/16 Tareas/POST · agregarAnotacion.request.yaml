$kind: http-request
description: |-
  POST /api/tareas/:id/anotaciones
  Origen: src/modules/RRHH/tareas/controller/tareas.controller.ts:128
  Handler: agregarAnotacion
  Roles: CONTADOR, ADMIN, ASISTENTE
  HTTP esperado con datos y estado válidos: 201.
url: "{{base_url}}/api/v1/rrhh/tareas/{{tarea_id}}/anotaciones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "descripcion": "Revisión de incidencias completada para prueba"
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test('HTTP esperado: [201]', () =>
      pm.expect([201]).to.include(pm.response.code));

      if (pm.response.code < 300) pm.test('Respuesta JSON', () =>
      pm.response.json());

      if (pm.response.code < 300) { const r=pm.response.json(); const d=r.data
      || r; const entity=d.id ? d : d.data; if (entity && entity.id)
      pm.environment.set('tarea_id',entity.id); }
    language: text/javascript
order: 4000
