$kind: http-request
description: |-
  POST /api/contrato/:id/renovar
  Origen: src/modules/RRHH/contrato/controller/contrato.controller.ts:112
  Handler: renovarContrato
  Roles: ADMIN, RRHH
  HTTP esperado con datos y estado válidos: 201.
url: "{{base_url}}/api/v1/rrhh/contrato/{{contrato_id}}/renovar"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fecha_inicio": "2027-01-01",
      "fecha_fin": "2027-12-31",
      "tipo_modalidad": "PLAZO_FIJO",
      "observacion": "Renovación de prueba"
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test('HTTP esperado: [201]', () =>
      pm.expect([201]).to.include(pm.response.code));

      if (pm.response.code < 300) pm.test('Respuesta JSON', () =>
      pm.response.json());

      if (pm.response.code < 300) { const r=pm.response.json(); const d=r.data
      || r; const entity=d.id ? d : d.data; if (entity && entity.id)
      pm.environment.set('contrato_id',entity.id); }
    language: text/javascript
examples: .resources/POST · renovarContrato.resources/examples
order: 3000
