$kind: http-request
description: >-
  POST /api/contrato/:id/subir-pdf

  Origen: src/modules/RRHH/contrato/controller/contrato.controller.ts:188

  Handler: subirContratoPdf

  Roles: ADMIN, RRHH

  HTTP esperado con datos y estado válidos: 201.

  Elegir el archivo local en el campo file. Los campos de texto van antes del
  archivo; Postman genera el boundary.
url: "{{base_url}}/api/v1/rrhh/contrato/{{contrato_id}}/subir-pdf"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - /C:/Users/ZER0SEV7N/Documents/ntt/2026-10-05 - Contrato de trabajo -
          Daniel Enrique Singer Rojas.pdf
      disabled: false
scripts:
  - type: afterResponse
    code: >-
      pm.test('HTTP esperado: [201]', () =>
      pm.expect([201]).to.include(pm.response.code));

      if (pm.response.code < 300) pm.test('Respuesta JSON', () =>
      pm.response.json());

      if (pm.response.code < 300) { const r=pm.response.json(); const d=r.data
      || r; const entity=d.id ? d : d.data; if (entity && entity.id)
      pm.environment.set('contrato_id',entity.id); }

      if (pm.response.code < 300) { const r=pm.response.json(); const d=r.data
      || r; if (d.url)
      pm.environment.set('contrato_filename',d.url.split('/').pop()); }
    language: text/javascript
examples: .resources/POST · subirContratoPdf.resources/examples
order: 7000
