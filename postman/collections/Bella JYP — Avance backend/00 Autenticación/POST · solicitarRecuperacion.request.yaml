$kind: http-request
description: >-
  POST /api/auth/recuperar-password

  Origen: src/modules/core/auth/controller/auth.controller.ts:131

  Handler: solicitarRecuperacion

  Roles: Público

  HTTP esperado con datos y estado válidos: 200.

  503 indica integración de correo/n8n no configurada o no disponible; no
  acredita envío. Restablecer contraseña todavía no tiene controller.
url: "{{base_url}}/api/auth/recuperar-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nro_documento": "{{login_documento}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: >-
      pm.test('HTTP esperado: [200, 503]', () => pm.expect([200,
      503]).to.include(pm.response.code));

      if (pm.response.code < 300) pm.test('Respuesta JSON', () =>
      pm.response.json());
    language: text/javascript
order: 4000
