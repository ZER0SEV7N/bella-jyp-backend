$kind: http-request
description: |-
  POST /api/auth/refresh
  Origen: src/modules/core/auth/controller/auth.controller.ts:72
  Handler: refreshToken
  Roles: Público
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/v1/auth/refresh"
method: POST
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: >-
      pm.test('HTTP esperado: [200]', () =>
      pm.expect([200]).to.include(pm.response.code));

      if (pm.response.code < 300) pm.test('Respuesta JSON', () =>
      pm.response.json());

      if (pm.response.code === 200) { const r = pm.response.json(); const d =
      r.data || r; pm.environment.set('access_token', d.accessToken); const rol
      = pm.environment.get('rol_actual'); if (rol) pm.environment.set('token_' +
      rol.toLowerCase(), d.accessToken); }
    language: text/javascript
examples: .resources/POST · refreshToken.resources/examples
order: 2000
