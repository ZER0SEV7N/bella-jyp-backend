$kind: http-request
description: |-
  POST /api/auth/provisionar
  Origen: src/modules/core/auth/controller/auth.controller.ts:113
  Handler: provisionar
  Roles: ADMIN, RRHH
  HTTP esperado con datos y estado válidos: 201.
url: "{{base_url}}/api/v1/auth/provisionar"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipo_documento": "DNI",
      "nro_documento": "{{documento_demo}}",
      "email": "{{email_demo}}",
      "password": "{{password_nuevo_usuario}}",
      "rol": "EMPLEADO"
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test('HTTP esperado: [201]', () =>
      pm.expect([201]).to.include(pm.response.code));

      if (pm.response.code < 300) pm.test('Respuesta JSON', () =>
      pm.response.json());
    language: text/javascript
order: 3000
