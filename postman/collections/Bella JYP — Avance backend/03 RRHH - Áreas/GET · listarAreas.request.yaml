$kind: http-request
description: |-
  GET /api/rrhh/area
  Origen: src/modules/RRHH/organizacion/controllers/area.controller.ts:120
  Handler: listarAreas
  Roles: ADMIN, RRHH
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/v1/rrhh/area?page=1&limit=10"
method: GET
queryParams:
  - key: page
    value: "1"
  - key: limit
    value: "10"
  - key: search
    value: demo
    disabled: true
  - key: activo
    value: "true"
    disabled: true
scripts:
  - type: afterResponse
    code: >-
      pm.test('HTTP esperado: [200]', () =>
      pm.expect([200]).to.include(pm.response.code));

      if (pm.response.code < 300) pm.test('Respuesta JSON', () =>
      pm.response.json());
    language: text/javascript
examples: .resources/GET · listarAreas.resources/examples
order: 5000
