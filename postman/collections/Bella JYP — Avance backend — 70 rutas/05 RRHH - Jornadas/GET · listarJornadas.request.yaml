$kind: http-request
description: |-
  GET /api/rrhh/jornadas
  Origen: src/modules/RRHH/organizacion/controllers/jornada.controller.ts:92
  Handler: listarJornadas
  Roles: ADMIN, RRHH, CONTADOR
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/rrhh/jornadas?page=1&limit=10"
method: GET
queryParams:
  - key: page
    value: "1"
  - key: limit
    value: "10"
  - key: search
    value: demo
    disabled: true
  - key: area_id
    value: "{{area_id}}"
    disabled: true
  - key: turno
    value: MANANA
    disabled: true
  - key: modalidad
    value: PRESENCIAL
    disabled: true
  - key: duracion
    value: TIEMPO_COMPLETO
    disabled: true
  - key: activo
    value: "true"
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP esperado: [200]', () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code < 300) pm.test('Respuesta JSON', () => pm.response.json());
    language: text/javascript
order: 2000
