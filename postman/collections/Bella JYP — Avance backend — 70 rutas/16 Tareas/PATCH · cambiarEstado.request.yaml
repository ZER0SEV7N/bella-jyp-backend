$kind: http-request
description: |-
  PATCH /api/tareas/:id/estado
  Origen: src/modules/RRHH/tareas/controller/tareas.controller.ts:102
  Handler: cambiarEstado
  Roles: CONTADOR, ADMIN, ASISTENTE
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/tareas/{{tarea_id}}/estado"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estado": "REVISION"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP esperado: [200]', () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code < 300) pm.test('Respuesta JSON', () => pm.response.json());
    language: text/javascript
order: 3000
