$kind: http-request
description: |-
  DELETE /api/rrhh/area/:id/desactive
  Origen: src/modules/RRHH/organizacion/controllers/area.controller.ts:101
  Handler: eliminar
  Roles: ADMIN, RRHH
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/rrhh/area/{{area_id}}/desactive"
