$kind: http-request
description: |-
  PATCH /api/rrhh/area/:id/reactive
  Origen: src/modules/RRHH/organizacion/controllers/area.controller.ts:85
  Handler: reactive
  Roles: ADMIN, RRHH
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/rrhh/area/{{area_id}}/reactive"
method: PATCH
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP esperado: [200]', () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code < 300) pm.test('Respuesta JSON', () => pm.response.json());
    language: text/javascript
order: 3000
