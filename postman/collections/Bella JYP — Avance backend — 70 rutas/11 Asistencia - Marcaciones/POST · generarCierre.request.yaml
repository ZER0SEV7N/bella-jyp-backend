$kind: http-request
description: |-
  POST /api/asistencia/marcacion/web
  Origen: src/modules/asistencia/controller/asistencias.controller.ts:19
  Handler: generarCierre
  Roles: ADMIN, RRHH, CONTADOR, ASISTENTE
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/asistencia/marcacion/web"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nro_documento": "{{documento_demo}}",
      "fecha_hora": "{{fecha_marcacion}}",
      "tipo_marcacion": "ENTRADA"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP esperado: [200]', () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code < 300) pm.test('Respuesta JSON', () => pm.response.json());
    language: text/javascript
order: 1000
