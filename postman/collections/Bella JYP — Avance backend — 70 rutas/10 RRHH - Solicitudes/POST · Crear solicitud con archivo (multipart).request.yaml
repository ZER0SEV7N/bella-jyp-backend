$kind: http-request
description: |-
  POST /api/rrhh/solicitudes
  Origen: src/modules/RRHH/solicitudes/controller/solicitud.controller.ts:59
  Handler: crear
  Roles: ADMIN, RRHH, EMPLEADO
  HTTP esperado con datos y estado válidos: 201.
url: "{{base_url}}/api/rrhh/solicitudes"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: empleado_id
      value: "{{empleado_id}}"
    - type: text
      key: tipo
      value: PERMISO
    - type: text
      key: fecha_inicio
      value: 2026-10-20
    - type: text
      key: fecha_fin
      value: 2026-10-20
    - type: text
      key: dias_solicitados
      value: "1"
    - type: text
      key: motivo
      value: Permiso personal para una cita programada
    - type: text
      key: origen
      value: MANUAL_RRHH
    - type: file
      key: archivo
      src: []
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP esperado: [201]', () => pm.expect([201]).to.include(pm.response.code));
      if (pm.response.code < 300) pm.test('Respuesta JSON', () => pm.response.json());
      if (pm.response.code < 300) { const r=pm.response.json(); const d=r.data || r; const entity=d.id ? d : d.data; if (entity && entity.id) pm.environment.set('solicitud_id',entity.id); }
      if (pm.response.code < 300) { const r=pm.response.json(); const d=r.data || r; if (d.codigo) pm.environment.set('solicitud_codigo',d.codigo); }
    language: text/javascript
order: 7000
