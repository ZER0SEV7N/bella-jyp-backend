$kind: http-request
description: |-
  POST /api/afp/comisiones
  Origen: src/modules/payroll/afp/controller/afp.controller.ts:70
  Handler: agregarComision
  Roles: JYP
  HTTP esperado con datos y estado válidos: 201.
url: "{{base_url}}/api/afp/comisiones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipo_afp_id": "{{tipo_afp_id}}",
      "nueva_comision": {
        "periodo_inicio": "2027-01-01",
        "aporte_obligatorio": 10,
        "comision_sobre_ra": 0,
        "prima_seguro": 0,
        "comision_mixta": 0
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{token_jyp}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP esperado: [201]', () => pm.expect([201]).to.include(pm.response.code));
      if (pm.response.code < 300) pm.test('Respuesta JSON', () => pm.response.json());
    language: text/javascript
order: 1000
