$kind: http-request
description: |-
  GET /api/audit/logs
  Origen: src/modules/core/audit/controller/audit.controller.ts:51
  Handler: obtenerLogs
  Roles: ADMIN, RRHH, CONTADOR
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/audit/logs?page=1&limit=10"
method: GET
queryParams:
  - key: page
    value: "1"
  - key: limit
    value: "10"
  - key: tabla_afectada
    value: empleados
    disabled: true
  - key: accion
    value: UPDATE
    disabled: true
  - key: usuario_id
    value: "{{usuario_id}}"
    disabled: true
  - key: registro_id
    value: "{{empleado_id}}"
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP esperado: [200]', () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code < 300) pm.test('Respuesta JSON', () => pm.response.json());
    language: text/javascript
order: 1000
