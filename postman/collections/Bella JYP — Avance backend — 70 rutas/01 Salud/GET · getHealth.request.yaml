$kind: http-request
description: |-
  GET /api/v1/health
  Origen: src/app.controller.ts:17
  Handler: getHealth
  Roles: Público
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/v1/health"
