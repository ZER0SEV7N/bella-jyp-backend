$kind: http-request
description: |-
  POST /api/rrhh/cargo/crear
  Origen: src/modules/RRHH/organizacion/controllers/cargo.controller.ts:52
  Handler: crear
  Roles: ADMIN, RRHH
  HTTP esperado con datos y estado válidos: 201.
url: "{{base_url}}/api/rrhh/cargo/crear"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_area": "{{area_id}}",
      "nombre": "Analista demo",
      "descripcion": "Cargo de oficina",
      "sueldo_minimo": 1500,
      "sueldo_maximo": 4000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP esperado: [201]', () => pm.expect([201]).to.include(pm.response.code));
      if (pm.response.code < 300) pm.test('Respuesta JSON', () => pm.response.json());
      if (pm.response.code < 300) { const r=pm.response.json(); const d=r.data || r; const entity=d.id ? d : d.data; if (entity && entity.id) pm.environment.set('cargo_id',entity.id); }
    language: text/javascript
order: 1000
