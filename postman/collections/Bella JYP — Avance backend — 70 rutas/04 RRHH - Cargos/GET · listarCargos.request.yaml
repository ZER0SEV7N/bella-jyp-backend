$kind: http-request
description: |-
  GET /api/rrhh/cargo
  Origen: src/modules/RRHH/organizacion/controllers/cargo.controller.ts:126
  Handler: listarCargos
  Roles: ADMIN, RRHH
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/rrhh/cargo?page=1&limit=10"
method: GET
queryParams:
  - key: page
    value: "1"
  - key: limit
    value: "10"
  - key: id_area
    value: "{{area_id}}"
    disabled: true
  - key: search
    value: demo
    disabled: true
  - key: activo
    value: "true"
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP esperado: [200]', () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code < 300) pm.test('Respuesta JSON', () => pm.response.json());
    language: text/javascript
order: 5000
