$kind: http-request
description: |-
  POST /api/rrhh/derechohabientes/registrar
  Origen: src/modules/RRHH/organizacion/controllers/derechohabiente.controller.ts:63
  Handler: registrarDerechohabiente
  Roles: ADMIN, RRHH
  HTTP esperado con datos y estado válidos: 201.
url: "{{base_url}}/api/rrhh/derechohabientes/registrar"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "empleado_id": "{{empleado_id}}",
      "documento_id": "{{documento_id}}",
      "nro_documento": "{{documento_derechohabiente}}",
      "nombres": "Hijo Demo",
      "apellidos": "Pruebas",
      "vinculo": "HIJO_MENOR",
      "estado_civil": "SOLTERO",
      "sexo": "MASCULINO",
      "fecha_nacimiento": "2018-05-10"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP esperado: [201]', () => pm.expect([201]).to.include(pm.response.code));
      if (pm.response.code < 300) pm.test('Respuesta JSON', () => pm.response.json());
      if (pm.response.code < 300) { const r=pm.response.json(); const d=r.data || r; const entity=d.id ? d : d.data; if (entity && entity.id) pm.environment.set('derechohabiente_id',entity.id); }
    language: text/javascript
order: 1000
