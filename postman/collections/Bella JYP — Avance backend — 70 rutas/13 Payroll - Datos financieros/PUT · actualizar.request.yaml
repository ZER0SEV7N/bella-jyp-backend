$kind: http-request
description: |-
  PUT /api/dato-financiero/empleado/:idEmpleado
  Origen: src/modules/payroll/datoFinanciero/controller/datoFinanciero.controller.ts:101
  Handler: actualizar
  Roles: ADMIN, RRHH
  HTTP esperado con datos y estado válidos: 200.
url: "{{base_url}}/api/dato-financiero/empleado/{{empleado_id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sueldo_basico": 2500,
      "password_confirmacion": "{{password_actor_actual}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP esperado: [200]', () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code < 300) pm.test('Respuesta JSON', () => pm.response.json());
    language: text/javascript
order: 3000
