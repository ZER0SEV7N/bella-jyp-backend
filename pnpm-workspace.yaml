allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

# Versiones parcheadas de dependencias transitivas con vulnerabilidades (pnpm audit).
overrides:
  effect@<3.22.1: ^3.22.5

# Vulnerabilidades altas aceptadas temporalmente porque su arreglo exige un cambio mayor:
# - GHSA-mrhx-c7xc-m3w5 (zod <4.6.6): shared-contracts usa zod 3; se resuelve al migrar a zod 4.
# - GHSA-x8mw-p69m-v3mx (@fastify/busboy <3.2.1): fastify-multer 2.0.3 exige @fastify/busboy 1.x.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-x8mw-p69m-v3mx
