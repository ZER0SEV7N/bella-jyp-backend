name: CI - Build, Seguridad y Cobertura (MVP)

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - master

# Cancela corridas anteriores en ramas feature/PR, pero nunca en master.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Principio de menor privilegio: solo lectura.
permissions:
  contents: read

jobs:
  # 1. Verificación de credenciales y secretos en código e historial Git
  secret-scan:
    name: Verificar credenciales y secretos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # 2. Compilación, complejidad y Quality Gate de cobertura >= 80%
  build-and-test:
    name: Compilar, Probar y Validar Cobertura >= 80%
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configurar Node.js 22 con caché de pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Autenticar acceso a @jyp/shared-contracts (solo si es privado)
        if: ${{ secrets.SHARED_CONTRACTS_TOKEN != '' }}
        env:
          GH_PAT: ${{ secrets.SHARED_CONTRACTS_TOKEN }}
        run: |
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Instalar dependencias (lockfile estricto)
        run: pnpm install --frozen-lockfile

      - name: Generar cliente de Prisma
        env:
          # Variable sintética solo para generar tipos/cliente en CI
          DATABASE_URL: postgresql://ci:ci@localhost:5432/planillas_ci
        run: pnpm exec prisma generate

      - name: Compilar proyecto NestJS
        run: pnpm run build

      - name: Verificar complejidad ciclomática (reglas SonarQube)
        run: pnpm run check:complejidad

      - name: Ejecutar pruebas unitarias y Quality Gate (>= 80%)
        run: pnpm run test:cov

      - name: Reporte informativo de auditoría de dependencias (no bloqueante en MVP)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      - name: Publicar reporte de cobertura (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jest-lcov
          path: coverage/
          retention-days: 14

  # 3. Verificación de empaquetado Docker en master (sin publicar ni versionar aún)
  docker-verify:
    name: Verificar Build de Imagen Docker (master)
    needs: [secret-scan, build-and-test]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verificar compilación de ./dockerfile (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ secrets.SHARED_CONTRACTS_TOKEN || github.token }}