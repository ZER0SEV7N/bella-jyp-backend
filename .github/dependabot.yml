version: 2
updates:
  # Dependencias de Node.js / NestJS (SCA automatizado)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  # Acciones de GitHub Actions (mantiene checkout, setup-node, trivy, etc. actualizados)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
    labels:
      - "ci/cd"
      - "dependencies"
